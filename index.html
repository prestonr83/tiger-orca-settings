<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Orca Filament Settings</title>
<style>
:root {
  --bg: #f6f5f2; --card: #ffffff; --fg: #1d1f23; --muted: #6b6f78; --line: #e4e2dc;
  --accent: #e8742c; --accent-soft: #fbe9dd; --tiger: #2f6f9f; --tiger-soft: #e2eef7;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171a; --card: #1d2024; --fg: #e9e7e2; --muted: #9a9ea6; --line: #2c3036;
    --accent: #f08a46; --accent-soft: #3a2619; --tiger: #7fb3dc; --tiger-soft: #1b2a36;
  }
}
:root[data-theme="dark"] {
  --bg: #15171a; --card: #1d2024; --fg: #e9e7e2; --muted: #9a9ea6; --line: #2c3036;
  --accent: #f08a46; --accent-soft: #3a2619; --tiger: #7fb3dc; --tiger-soft: #1b2a36;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--fg);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 860px; margin: 0 auto; padding: 28px 16px 48px; }
header { display: flex; gap: 18px; align-items: center; margin-bottom: 22px; }
.swatch { flex: none; width: 64px; height: 64px; border-radius: 50%;
  border: 3px solid var(--card); box-shadow: 0 0 0 1px var(--line); }
h1 { font-size: 24px; line-height: 1.2; margin: 0 0 4px; overflow-wrap: anywhere; }
.sub { color: var(--muted); font-size: 14px; }
.sub b { color: var(--fg); font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 16px; margin: 0 0 18px; font-size: 13px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px;
  margin-right: 6px; vertical-align: -1px; }
.legend .mine::before { background: var(--accent); }
.legend .tiger::before { background: var(--tiger); }
section { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  margin-bottom: 14px; overflow: hidden; }
section h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted);
  margin: 0; padding: 12px 16px 8px; font-weight: 600; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; align-items: baseline;
  padding: 9px 16px; border-top: 1px solid var(--line); border-left: 3px solid transparent; }
.row.mine { border-left-color: var(--accent); }
.row.tiger { border-left-color: var(--tiger); }
.label { overflow-wrap: anywhere; }
.key { display: block; font: 12px var(--mono); color: var(--muted); overflow-wrap: anywhere; }
.value { font: 600 14px var(--mono); text-align: right; overflow-wrap: anywhere; max-width: 46vw; }
.row.mine .value { color: var(--accent); }
.row.tiger .value { color: var(--tiger); }
.note { color: var(--muted); font-size: 13px; padding: 12px 16px 14px; border-top: 1px solid var(--line); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 18px 0 0; }
button { font: inherit; font-size: 14px; color: var(--fg); background: var(--card); border: 1px solid var(--line);
  border-radius: 8px; padding: 8px 14px; cursor: pointer; }
button:hover { border-color: var(--accent); }
.empty { text-align: center; padding: 60px 16px; color: var(--muted); }
.empty h1 { color: var(--fg); }
footer { margin-top: 26px; color: var(--muted); font-size: 12px; }
@media (max-width: 520px) {
  .row { grid-template-columns: 1fr; }
  .value { text-align: left; max-width: none; }
  h1 { font-size: 20px; }
}
</style>
</head>
<body>
<main id="app"><div class="empty"><h1>Loading…</h1></div></main>
<script>
// The settings travel in the link itself, after the "#". Browsers never send that part to a
// server, so this page only ever sees them on your device. Format: base64url(zlib(JSON)).
const SECTIONS = [
  ["Filament", [
    ["filament_diameter", "Diameter", "mm"], ["filament_density", "Density", "g/cm³"],
    ["filament_cost", "Price", "/kg"], ["filament_soluble", "Soluble material"],
    ["filament_is_support", "Support material"], ["filament_shrink", "Shrinkage (XY)"],
    ["filament_shrinkage_compensation_z", "Shrinkage (Z)"],
    ["temperature_vitrification", "Softening temperature", "°C"], ["idle_temperature", "Idle temperature", "°C"],
    ["filament_ramming_length", "Ramming length", "mm"],
    ["nozzle_temperature_range_low", "Recommended nozzle min", "°C"],
    ["nozzle_temperature_range_high", "Recommended nozzle max", "°C"],
  ]],
  ["Flow ratio & pressure advance", [
    ["filament_flow_ratio", "Flow ratio"], ["enable_pressure_advance", "Pressure advance"],
    ["pressure_advance", "Pressure advance (K)"], ["adaptive_pressure_advance", "Adaptive pressure advance"],
    ["filament_max_volumetric_speed", "Max volumetric speed", "mm³/s"],
  ]],
  ["Temperatures", [
    ["nozzle_temperature_initial_layer", "Nozzle, first layer", "°C"], ["nozzle_temperature", "Nozzle, other layers", "°C"],
    ["chamber_temperature", "Chamber target", "°C"], ["chamber_temperatures", "Chamber target", "°C"],
    ["supertack_plate_temp_initial_layer", "Cool Plate SuperTack, first layer", "°C"],
    ["supertack_plate_temp", "Cool Plate SuperTack", "°C"],
    ["cool_plate_temp_initial_layer", "Cool plate, first layer", "°C"], ["cool_plate_temp", "Cool plate", "°C"],
    ["textured_cool_plate_temp_initial_layer", "Textured cool plate, first layer", "°C"],
    ["textured_cool_plate_temp", "Textured cool plate", "°C"],
    ["eng_plate_temp_initial_layer", "Engineering plate, first layer", "°C"], ["eng_plate_temp", "Engineering plate", "°C"],
    ["hot_plate_temp_initial_layer", "Smooth PEI / high temp, first layer", "°C"],
    ["hot_plate_temp", "Smooth PEI / high temp", "°C"],
    ["textured_plate_temp_initial_layer", "Textured PEI, first layer", "°C"], ["textured_plate_temp", "Textured PEI", "°C"],
  ]],
  ["Cooling", [
    ["close_fan_the_first_x_layers", "No cooling for first", "layers"],
    ["full_fan_speed_layer", "Full fan speed at layer"],
    ["fan_min_speed", "Min fan speed", "%"], ["fan_cooling_layer_time", "…at layer time", "s"],
    ["fan_max_speed", "Max fan speed", "%"], ["slow_down_layer_time", "…at layer time", "s"],
    ["reduce_fan_stop_start_freq", "Keep fan always on"],
    ["slow_down_for_layer_cooling", "Slow down for layer cooling"],
    ["dont_slow_down_outer_wall", "Don't slow down outer walls"], ["slow_down_min_speed", "Min print speed", "mm/s"],
    ["enable_overhang_bridge_fan", "Force cooling for overhangs & bridges"],
    ["overhang_fan_threshold", "Overhang cooling threshold"],
    ["overhang_fan_speed", "Overhang & external bridge fan", "%"],
    ["internal_bridge_fan_speed", "Internal bridge fan", "%"],
    ["support_material_interface_fan_speed", "Support interface fan", "%"],
    ["ironing_fan_speed", "Ironing fan", "%"], ["additional_cooling_fan_speed", "Auxiliary fan", "%"],
    ["activate_air_filtration", "Air filtration"],
    ["during_print_exhaust_fan_speed", "Exhaust fan during print", "%"],
    ["complete_print_exhaust_fan_speed", "Exhaust fan after print", "%"],
  ]],
  ["Retraction overrides", [
    ["filament_retraction_length", "Length", "mm"], ["filament_z_hop", "Z-hop height", "mm"],
    ["filament_z_hop_types", "Z-hop type"], ["filament_retract_lift_above", "Only lift Z above", "mm"],
    ["filament_retract_lift_below", "Only lift Z below", "mm"], ["filament_retract_lift_enforce", "Lift on surfaces"],
    ["filament_retraction_speed", "Retraction speed", "mm/s"], ["filament_deretraction_speed", "Deretraction speed", "mm/s"],
    ["filament_retract_restart_extra", "Extra length on restart", "mm"],
    ["filament_retraction_minimum_travel", "Travel distance threshold", "mm"],
    ["filament_retract_when_changing_layer", "Retract on layer change"], ["filament_wipe", "Wipe while retracting"],
    ["filament_wipe_distance", "Wipe distance", "mm"], ["filament_retract_before_wipe", "Retract before wipe", "%"],
    ["filament_retraction_length_toolchange", "Length on material change", "mm"],
    ["filament_retract_restart_extra_toolchange", "Extra length on restart after change", "mm"],
  ]],
  ["Ironing", [
    ["filament_ironing_flow", "Flow", "%"], ["filament_ironing_spacing", "Line spacing", "mm"],
    ["filament_ironing_inset", "Inset", "mm"], ["filament_ironing_speed", "Speed", "mm/s"],
  ]],
];
const KNOWN = new Map(SECTIONS.flatMap(([, rows]) => rows.map(r => [r[0], r])));

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
}
function pretty(key, value) {
  const unit = KNOWN.get(key)?.[2];
  let v = Array.isArray(value) ? value.join(", ") : String(value ?? "");
  if (/^(enable_|filament_soluble|filament_is_support|reduce_fan|slow_down_for|dont_slow|activate_|filament_wipe$|filament_retract_when)/.test(key)) {
    if (v === "1" || v === "true") v = "Yes"; else if (v === "0" || v === "false") v = "No";
  }
  if (unit && v !== "" && !/[a-z%]/i.test(v)) v += unit.startsWith("/") ? unit : " " + unit;
  return v;
}
async function decode(fragment) {
  const b64 = fragment.replace(/-/g, "+").replace(/_/g, "/");
  const bytes = Uint8Array.from(atob(b64 + "===".slice((b64.length + 3) % 4)), c => c.charCodeAt(0));
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate"));
  return JSON.parse(await new Response(stream).text());
}
function row(key, value, kind) {
  const label = KNOWN.get(key)?.[1] || key.replace(/_/g, " ");
  return `<div class="row ${kind}"><div class="label">${esc(label)}<span class="key">${esc(key)}</span></div>
    <div class="value">${esc(pretty(key, value))}</div></div>`;
}
function render(d) {
  const mine = d.settings || {}, tiger = d.tiger || {};
  const all = {...mine, ...tiger};
  document.title = `${d.name || "Filament"} · Orca settings`;
  let html = `<header><div class="swatch" style="background:${esc(/^#[0-9a-f]{6}$/i.test(d.color || "") ? d.color : "#999")}"></div>
    <div><h1>${esc(d.name || "Filament")}</h1>
    <div class="sub">Based on <b>${esc(d.base || "Orca defaults")}</b>${d.updated ? ` · updated ${esc(new Date(d.updated).toLocaleString())}` : ""}</div></div></header>
    <div class="legend"><span class="mine">Your setting, stored in Tiger Studio</span><span class="tiger">From the Tiger Studio spool</span></div>`;
  const shown = new Set();
  for (const [title, rows] of SECTIONS) {
    const items = rows.filter(([key]) => key in all && !shown.has(key));
    if (!items.length) continue;
    items.forEach(([key]) => shown.add(key));
    html += `<section><h2>${esc(title)}</h2>${items.map(([key]) => row(key, all[key], key in tiger ? "tiger" : "mine")).join("")}</section>`;
  }
  const other = Object.keys(all).filter(k => !shown.has(k)).sort();
  if (other.length) html += `<section><h2>Other</h2>${other.map(k => row(k, all[k], k in tiger ? "tiger" : "mine")).join("")}</section>`;
  if (!Object.keys(mine).length) html += `<section><div class="note">No settings of your own yet: everything else comes from ${esc(d.base || "the base preset")}.</div></section>`;
  else html += `<section><div class="note">Anything not listed comes from ${esc(d.base || "the base preset")}.</div></section>`;
  html += `<div class="actions"><button id="copy">Copy settings as JSON</button></div>
    <footer>Stored in Tiger Studio by the Tiger Canvas Spools OrcaSlicer plugin. This page holds no data: everything shown came in the link.</footer>`;
  document.getElementById("app").innerHTML = html;
  document.getElementById("copy").onclick = async e => {
    try { await navigator.clipboard.writeText(JSON.stringify({basePreset: d.base, settings: mine}, null, 2)); e.target.textContent = "Copied"; }
    catch { e.target.textContent = "Copy failed"; }
  };
}
async function main() {
  const fragment = location.hash.slice(1);
  if (!fragment) {
    document.getElementById("app").innerHTML = `<div class="empty"><h1>Orca filament settings</h1>
      <p>Open this page from a filament's "Orca settings" link in Tiger Studio.</p></div>`;
    return;
  }
  try { render(await decode(fragment)); }
  catch (e) {
    document.getElementById("app").innerHTML = `<div class="empty"><h1>This link could not be read</h1>
      <p>It may have been cut short when copied. Open it again from Tiger Studio.</p></div>`;
  }
}
window.addEventListener("hashchange", main);
main();
</script>
</body>
</html>
